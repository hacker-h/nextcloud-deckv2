<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CI/CD & Watchtower Deployment Architecture</title>
  <style>
    body {
      background-color: #1D2125;
      color: #CECFD2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 40px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #ffffff;
      margin-bottom: 24px;
    }
    .card {
      background: #242528;
      border: 1px solid rgba(227, 228, 242, 0.12);
      border-radius: 12px;
      padding: 32px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .mermaid {
      display: flex;
      justify-content: center;
      margin: 24px 0;
    }
  </style>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true, theme: 'dark' });
  </script>
</head>
<body>
  <div class="card">
    <h1>CI/CD & Watchtower Deployment Architecture</h1>
    <div class="mermaid">
      graph LR
        A[1. Push code to main] --> B[2. CI/CD Build Image]
        B --> C[3. Push to ghcr.io / registry]
        C --> D[4. Watchtower Polls Registry on Alice]
        D --> E[5. Auto Pull & Restart deckv2]
    </div>
  </div>
</body>
</html>
