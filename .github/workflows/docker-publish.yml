name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      smoke:
        description: 'Run the production smoke tests against the live deployment'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deckv2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate. Nothing is published until the unit suite and the hermetic browser
  # suite both pass. The hermetic specs mock the backend in the browser, so they
  # need no Nextcloud instance and no credentials, which is what makes them
  # usable as a required check rather than an advisory one.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    # Pinned to the same Playwright version as package.json. The image ships the
    # exact browser builds that produced the committed -linux.png baselines;
    # installing browsers ad hoc would drift and turn every visual test red.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001

    # The build sha is normally read from git, but actions/checkout inside a
    # container leaves a repo this step's user does not own, so git refuses to
    # read it and build-info falls back to 'unknown'. Supplying it explicitly is
    # the documented path and is what the published image already does.
    env:
      BUILD_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static and accessibility checks
        run: npm run check

      - name: Dependency audit
        run: npm run test:audit

      - name: Unit tests
        run: npm test

      - name: Bundle security check
        run: npm run test:security

      - name: Hermetic browser tests (chromium, firefox, webkit)
        run: npx playwright test --project=hermetic-chromium --project=hermetic-firefox --project=hermetic-webkit

      # Traces, videos and the actual-vs-expected diff images for any failure.
      # Without this a red visual test in CI is unreadable: the diff exists only
      # inside the runner and is discarded when the job ends.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and health-check production image
        run: |
          docker build --build-arg BUILD_SHA=${{ github.sha }} -t deckv2:smoke .
          container=$(docker run -d -P -e NC_URL=https://nextcloud.invalid -e SESSION_SECRET=container-smoke-secret deckv2:smoke)
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' "$container")" = healthy ]; then
              curl --fail --silent "http://127.0.0.1:$(docker port "$container" 3000/tcp | head -n 1 | sed 's/.*://')/healthz" >/dev/null
              exit 0
            fi
            sleep 1
          done
          exit 1

  build-and-push:
    needs: [test, container-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Post-deploy verification against the live production deployment.
  #
  # This job cannot run automatically as part of the publish pipeline for two
  # environmental reasons:
  # 1. The target host (deckv2.xhacker.de) is IPv6-only (AAAA record only),
  #    whereas GitHub-hosted runners lack IPv6 connectivity and fail immediately
  #    with net::ERR_NAME_NOT_RESOLVED before making any HTTP request.
  # 2. Deployment is not immediate: the host runs Watchtower on a once-daily
  #    schedule (04:00 Europe/London), so polling for 5 minutes right after
  #    publishing would time out for up to 24 hours.
  #
  # This job is therefore manual-only and requires execution on a runner with
  # IPv6 reachability to the target host.
  prod-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No separate wait step: the version-pinning test polls the deployment for
      # the published sha itself. A shell-side curl grep could not do the same
      # job anyway - the sha is a compile-time define that exists only in the JS
      # bundle and the DOM it renders, never in the served HTML.
      - name: Smoke test the deployment
        run: npx playwright test --project=prod-smoke
        env:
          PROD_URL: https://deckv2.xhacker.de
          RELEASE_SHA: ${{ github.sha }}

      - name: Upload smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
